services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/tuberintel.db
      UPLOAD_DIR: /data/uploads
      ANNOTATED_DIR: /data/annotated
      FRONTEND_ORIGIN: http://localhost:8080
      AUTH_MODE: ${AUTH_MODE:-demo}
      MODEL_MODE: ${MODEL_MODE:-cv_demo}
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-potato-inspections}
    volumes:
      - tuberintel_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  tuberintel_data:
